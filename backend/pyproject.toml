[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "project-ledger"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi==0.143.0", "pydantic==2.12.3", "openpyxl==3.1.5", "httpx==0.28.1", "uvicorn==0.38.0", "argon2-cffi==25.1.0", "python-multipart==0.0.32", "defusedxml==0.7.1"]

[project.optional-dependencies]
test = ["pytest==9.1.1", "pip-audit==2.9.0"]

[project.scripts]
ledger = "ledger.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
